[project]
name = "lookahead-forecast"
version = "0.1.0"
description = "Two forecasting backends on one interface, the baselines and conformal quantiles"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lookahead-core",
  "lookahead-features",
  "numpy>=1.26",
  "polars>=1.10",
  "scipy>=1.14",
  "lightgbm>=4.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_forecast"]
