[project]
name = "lookahead-features"
version = "0.1.0"
description = "Point in time features: lags at availability, calendar, weather, thresholds"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lookahead-core",
  "polars>=1.10",
  "numpy>=1.26",
  "holidays>=0.60",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_features"]
