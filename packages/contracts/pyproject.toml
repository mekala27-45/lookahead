[project]
name = "lookahead-contracts"
version = "0.1.0"
description = "Typed frames, quarantine rules and provenance for EIA-930, the weather and the London release"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lookahead-core",
  "polars>=1.10",
  "duckdb>=1.1",
  "pyarrow>=17",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_contracts"]
