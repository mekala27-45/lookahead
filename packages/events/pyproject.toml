[project]
name = "lookahead-events"
version = "0.1.0"
description = "Residual based detection, defect classification, the operating point and the known events"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lookahead-core",
  "numpy>=1.26",
  "polars>=1.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_events"]
