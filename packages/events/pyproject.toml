[project]
name = "lookahead-events"
version = "0.1.0"
description = "Residual based anomaly detection: demand events told apart from data defects, graded on planted and known events"
requires-python = ">=3.12"
dependencies = [
  "lookahead-core",
  "lookahead-contracts",
  "lookahead-features",
  "lookahead-forecast",
  "lookahead-evaluation",
  "lookahead-sim",
  "numpy>=2.1",
  "polars>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_events"]

[tool.uv.sources]
lookahead-core = { workspace = true }
lookahead-contracts = { workspace = true }
lookahead-features = { workspace = true }
lookahead-forecast = { workspace = true }
lookahead-evaluation = { workspace = true }
lookahead-sim = { workspace = true }
