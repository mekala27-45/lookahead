[project]
name = "lookahead-hierarchy"
version = "0.1.0"
description = "The summing matrix, bottom up, top down and MinT reconciliation with coherence tests"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lookahead-core",
  "numpy>=1.26",
  "polars>=1.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_hierarchy"]
