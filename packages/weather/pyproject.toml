[project]
name = "lookahead-weather"
version = "0.1.0"
description = "Open-Meteo pulls per authority location, cached and committed as parquet with attribution"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lookahead-core",
  "httpx>=0.28",
  "polars>=1.10",
  "pyarrow>=17",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_weather"]
