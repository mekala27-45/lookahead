[project]
name = "lookahead-evaluation"
version = "0.1.0"
description = "The rolling origin harness, metrics, block bootstrap, Benjamini-Hochberg and the recovery study"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lookahead-core",
  "lookahead-features",
  "lookahead-forecast",
  "lookahead-hierarchy",
  "lookahead-events",
  "lookahead-sim",
  "numpy>=1.26",
  "polars>=1.10",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_evaluation"]
