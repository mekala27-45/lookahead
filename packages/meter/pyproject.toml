[project]
name = "lookahead-meter"
version = "0.1.0"
description = "The household meter: load shape clusters, the pre-registered time of use analysis, bottom up"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "lookahead-core",
  "lookahead-contracts",
  "lookahead-features",
  "lookahead-forecast",
  "lookahead-evaluation",
  "lookahead-hierarchy",
  "duckdb>=1.1",
  "polars>=1.10",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "openpyxl>=3.1",
  "pyarrow>=17",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_meter"]
