[project]
name = "lookahead"
version = "0.1.0"
description = "Demand forecasting for the U.S. power grid and the household meter: two backends graded against every operator's own day ahead forecast, reconciled across the hierarchy, with a live forecast log"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ajay Mekala" }]
dependencies = [
  "lookahead-core",
  "lookahead-contracts",
  "lookahead-sim",
  "lookahead-weather",
  "lookahead-features",
  "lookahead-forecast",
  "lookahead-hierarchy",
  "lookahead-events",
  "lookahead-meter",
  "lookahead-evaluation",
  "lookahead-registry",
  "lookahead-render",
  "lookahead-api",
  "typer>=0.15",
]

[project.scripts]
lookahead = "lookahead_registry.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "anyio>=4.6",
  "hypothesis>=6.120",
  "ruff>=0.11",
  "mypy>=1.15",
  "types-PyYAML",
  "pandas-stubs",
  "nbmake>=1.5",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "httpx>=0.28",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lookahead-core = { workspace = true }
lookahead-contracts = { workspace = true }
lookahead-sim = { workspace = true }
lookahead-weather = { workspace = true }
lookahead-features = { workspace = true }
lookahead-forecast = { workspace = true }
lookahead-hierarchy = { workspace = true }
lookahead-events = { workspace = true }
lookahead-meter = { workspace = true }
lookahead-evaluation = { workspace = true }
lookahead-registry = { workspace = true }
lookahead-render = { workspace = true }
lookahead-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["web", "data", "results", "notebooks", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/packages/api/src:$MYPY_CONFIG_FILE_DIR/packages/contracts/src:$MYPY_CONFIG_FILE_DIR/packages/core/src:$MYPY_CONFIG_FILE_DIR/packages/evaluation/src:$MYPY_CONFIG_FILE_DIR/packages/events/src:$MYPY_CONFIG_FILE_DIR/packages/features/src:$MYPY_CONFIG_FILE_DIR/packages/forecast/src:$MYPY_CONFIG_FILE_DIR/packages/hierarchy/src:$MYPY_CONFIG_FILE_DIR/packages/meter/src:$MYPY_CONFIG_FILE_DIR/packages/registry/src:$MYPY_CONFIG_FILE_DIR/packages/render/src:$MYPY_CONFIG_FILE_DIR/packages/sim/src:$MYPY_CONFIG_FILE_DIR/packages/weather/src"
explicit_package_bases = true
files = ["packages/*/src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "postgres: needs a reachable Postgres (LOOKAHEAD_TEST_DATABASE_URL or local binaries)",
  "external: needs the raw public files under data/external",
  "derived: needs the derived data under data/eia930, data/weather and data/london",
  "lightgbm: needs LightGBM importable",
  "slow: full pipeline verification",
  "loadtest: runs the load test against a live server",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_empty = true
